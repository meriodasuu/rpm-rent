name: rpm-rent

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - backend

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID:-}
        NEXT_PUBLIC_TELEGRAM_URL: ${NEXT_PUBLIC_TELEGRAM_URL:-}
        NEXT_PUBLIC_PHONE: ${NEXT_PUBLIC_PHONE:-}
        NEXT_PUBLIC_ADDRESS: ${NEXT_PUBLIC_ADDRESS:-}
        NEXT_PUBLIC_EMAIL: ${NEXT_PUBLIC_EMAIL:-}
        NEXT_PUBLIC_HOURS: ${NEXT_PUBLIC_HOURS:-}
        NEXT_PUBLIC_MAP_EMBED_URL: ${NEXT_PUBLIC_MAP_EMBED_URL:-}
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - backend
      - web

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

  tools:
    build:
      context: .
      target: tools
    profiles:
      - tools
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./import:/import:ro
    networks:
      - backend

networks:
  backend:
    internal: true
  web:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

